[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reacheco"
version = "0.1.0"
description = "Verification-guided safety repair of learned controllers"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy", "gymnasium"]

[tool.setuptools]
packages = ["reacheco", "reacheco.environments"]
